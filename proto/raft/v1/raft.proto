syntax = "proto3";

package raft.v1;

option go_package = "github.com/geekofshire/dist-kv-store/internal/raftpb/raftv1;raftv1";

message RequestVoteRequest {
    int32 term = 1;
    string candidate_id = 2;
    int32 last_log_index = 3;
    int32 last_log_term = 4;
}

message RequestVoteResponse {
    int32 term = 1;
    bool vote_granted = 2;
}

enum CommandType {
    SET = 0;
    DELETE = 1;
}

message Entry {
    CommandType cmd = 1;
    string key = 2;
    string value = 3;
    int32 index = 4;
    int32 term = 5;
}

message AppendEntriesRequest {
    string leader_id = 1;
    int32 leader_term = 2;
    int32 prev_log_index = 3;
    int32 prev_log_term = 4;
    repeated Entry entries = 5;
    int32 leader_commit = 6;
}

message AppendEntriesResponse {
    int32 term = 1;
    bool success = 2;
}

service RaftService {
    rpc RequestVote(RequestVoteRequest)
        returns (RequestVoteResponse);

    rpc AppendEntries(AppendEntriesRequest)
        returns (AppendEntriesResponse);
}